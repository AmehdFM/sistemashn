[project]
name = "sistemashn"
version = "0.1.0"
description = "SistemasHN Repuestos: punto de venta e inventario offline para negocios de Honduras"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Elements System" }]
dependencies = [
    "flet==1.0.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "openpyxl==3.1.5",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "fpdf2==2.8.8",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sistemashn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["evn", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.flet]
org = "hn.elementssystem"
product = "SistemasHN Repuestos"
company = "Elements System"
copyright = "Copyright (C) 2026 Elements System"

[tool.flet.app]
path = "src"
